[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyqt6-ela-pro"
dynamic = ["version"]
description = "PyQt6 extension widgets based on PyQt6ElaWidgetTools"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [
    {name = "pyqt6-ela-pro contributors"}
]
keywords = ["pyqt6", "qt6", "widgets", "gui", "extension"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",

    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: GUI Development",
]
dependencies = [
    # Win7 交付线套件 `PyElaWidgetTools/wheels/pyqt6-win7/`（见该目录 README）：
    # 官方 PyQt6 壳 + 自编译 Qt 6.8.4 运行库（替换 1634 个文件）+ 基于 qt684
    # 重建的 sip 绑定轮（`pyqt6-elawidgettools`，修掉了官方轮的 kwargs 崩）。
    # 四件套**必须同时列进 dependencies**：uv 只对**直接依赖**应用 [tool.uv.sources]
    # 的 path 源，不列就仍会去镜像站解析（PyQt6 是元包，依赖 Qt6 / sip 两件）。
    "PyQt6==6.8.1",
    "PyQt6-Qt6==6.8.2",
    "pyqt6-sip==13.13.0",
    "pypinyin>=0.50.0",
    "pyqt6-elawidgettools==0.13.0",
]

[project.optional-dependencies]
all = [
    "pywin32>=306",
    "comtypes>=1.4.0",
    "pygments>=2.15",
    "tsdownsample>=0.1.5.1",
    "mermaidx>=0.9",
    "orjson>=3.9",
    "polars>=1.0",
]
# ElaParquetTable 从顶层 __init__ 导出，所以「装了包却拿到一个必然抛
# ImportError 的公开类」是可达的。charts 系列的 polars / numpy /
# tsdownsample 走的就是 optional-dependencies 这条路，这里补齐同一套约定。
parquet = [
    "polars>=1.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-xdist>=3.6.1",
]

[project.urls]
Homepage = "https://github.com/mengdeer589/pyqt6-ela-pro"
Documentation = "https://github.com/mengdeer589/pyqt6-ela-pro#readme"
Repository = "https://github.com/mengdeer589/pyqt6-ela-pro"
Issues = "https://github.com/mengdeer589/pyqt6-ela-pro/issues"

[tool.setuptools.dynamic]
version = {attr = "pyqt6_ela_pro._version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
exclude = ["PyQt*", "PyQt-Fluent*", "PyQt-SiliconUI*", "build*", "dist*", "*.egg-info"]
include = ["pyqt6_ela_pro*"]

[tool.setuptools.package-data]
# 不再随包分发任何图标集（曾内置 3.66 MB / 2604 个 Fluent UI 图标 —— 组件库
# 不该替宿主选一套设计语言，绝大多数宿主也根本不用）。宿主用自己的图标包时
# 走 ElaSvgIconLoader.setPackageDirectory() / loadFromFile()，路径在宿主那边。
pyqt6_ela_pro = []

[tool.uv]
required-environments="sys_platform == 'win32' and platform_machine == 'AMD64'"
# 解析也只跑 win/AMD64：本库 Windows only，而「全平台候选」会让每次重新解析都去抓
# 外平台轮子的 body（这些大轮子没有 PEP 658 metadata）——镜像站上 403 就整条命令失败
# （实测 PyQt6_Qt6 的 macOS 轮）。限死后 lock 只登记 win_amd64 候选。
environments=["sys_platform == 'win32' and platform_machine == 'AMD64'"]

# 默认索引写进项目：宿主环境里可能带着别的第三方索引（如 ustc，对部分包 403），
# aliyun 完整且稳定 —— 见 AGENTS.md 的 Install & Run。
[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

# 开发期依赖走**本地 Win7 交付套件**（`PyElaWidgetTools/wheels/pyqt6-win7/`）：
# 官方 PyQt6 壳 + 自编译 Qt 6.8.4 运行库 + 基于 qt684 重建的绑定轮 —— 开发运行时
# 与 Win7 交付运行时保持一致（提前暴露 6.8.4/替换带来的差异）。
# 运行期自证：``qVersion()`` 应返回 **6.8.4**（官方为 6.8.2）。
# 本地轮重打包后哈希会变，`uv run` / `uv sync` 可能报 Hash mismatch（见 AGENTS.md）。
[tool.uv.sources]
pyqt6 = { path = "PyElaWidgetTools/wheels/pyqt6-win7/PyQt6-6.8.1-cp39-abi3-win_amd64.whl" }
pyqt6-qt6 = { path = "PyElaWidgetTools/wheels/pyqt6-win7/PyQt6_Qt6-6.8.2-py3-none-win_amd64.whl" }
pyqt6-sip = [
    # 交付套件里的 sip 轮是 cp311（Python 3.11 = Win7 线）；其它 Python 版本回落到
    # 镜像站的官方轮（13.13.0 也有 cp312 / cp313）。
    { path = "PyElaWidgetTools/wheels/pyqt6-win7/pyqt6_sip-13.13.0-cp311-cp311-win_amd64.whl", marker = "python_full_version < '3.12'" },
]
pyqt6-elawidgettools = { path = "PyElaWidgetTools/wheels/pyqt6-win7/pyqt6_elawidgettools-0.13.0-cp39-abi3-win_amd64.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# 默认并发（每个 worker 独立进程 / 独立 QApplication）；--dist loadfile
# 让同一测试文件落在一个 worker，保留模块级顺序与共享状态。
# 需要串行复现时用 `uv run pytest -n 0 ...`；想跑满核用 `-n auto`。
addopts = "-n 4 --dist loadfile"
# 让测试目录本身可导入，`from _qthelpers import wait_until` 才能在各子目录的
# 测试文件里生效（tests/ 下没有 __init__.py，否则靠 conftest 的副作用隐式生效）。
pythonpath = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-mock>=3.14.1",
    "pygments>=2.15",
    "tsdownsample>=0.1.5.1",
    "orjson>=3.9",
    "pytest-xdist>=3.6.1",
]
